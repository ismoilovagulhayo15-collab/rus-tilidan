<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315c4c"><title>Rus tili testi — 54 savol</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#202923;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 42px}.hero{background:#315c4c;color:white;border-radius:18px;padding:22px;margin-bottom:18px}.hero h1{font-size:24px;margin:0 0 5px}.hero p{margin:0;color:#e5eee8}.progress{height:8px;background:#dce5df;border-radius:9px;overflow:hidden;margin-top:16px}.bar{height:100%;width:0;background:#e8c77a;transition:width .2s}.meta{display:flex;justify-content:space-between;font-size:13px;margin-top:7px;color:#e5eee8}.section{font-size:18px;margin:25px 2px 10px;color:#315c4c}.q{background:white;border:1px solid #e1e8e3;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #173b2510}.q h3{font-size:16px;font-weight:650;margin:0 0 12px}.num{color:#668174;font-size:13px;font-weight:700;margin-right:5px}.opts{display:grid;gap:8px}.opt{display:flex;align-items:center;gap:10px;border:1px solid #dce5df;border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}.opt input{accent-color:#315c4c;width:18px;height:18px;flex:none}.opt:has(input:checked){border-color:#54836d;background:#f0f6f1}.actions{position:sticky;bottom:10px;display:flex;gap:10px;background:#f3f6f4eF;padding:10px 0;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#315c4c;color:white;flex:1}.secondary{background:#e1e9e3;color:#254536}.result{display:none;background:white;border:1px solid #dce5df;border-radius:16px;padding:20px;margin-top:18px}.score{font-size:34px;font-weight:800;color:#315c4c}.wrong{margin:10px 0;padding:10px;border-radius:9px;background:#fff4ed}.right{background:#eff7f0}.small{font-size:13px;color:#607267}.topbtn{display:inline-block;margin-top:10px;color:#315c4c;font-weight:700;text-decoration:underline;cursor:pointer}@media(max-width:420px){.wrap{padding:12px 10px 30px}.hero{padding:18px}.hero h1{font-size:21px}.q{padding:14px}.actions{bottom:4px}}
</style></head><body><main class="wrap"><header class="hero"><h1>Rus tili testi</h1><p>54 ta savol · Har bir savolda bitta javobni tanlang</p><div class="progress"><div class="bar" id="bar"></div></div><div class="meta"><span id="done">0 / 54 javob</span><span id="pct">0%</span></div></header><div id="quiz"></div><div class="actions"><button class="btn secondary" id="reset">Qayta boshlash</button><button class="btn primary" id="finish">Natijani ko‘rish</button></div><section class="result" id="result" aria-live="polite"></section></main><script>
const questions=[["Арслан, Ташкент – твой ___ город?", ["родная", "родной", "родное"], 1], ["В Петербурге ___ мечеть? – Да.", ["есть", "где", "в"], 0], ["___ Красноярске есть река? – Да.", ["Где", "В", "Из"], 1], ["В Джизаке есть мечеть? – Да, ___ есть мечеть.", ["там", "где", "в"], 0], ["Мы в Петербурге. ___ есть большая река Нева.", ["Где", "Там", "Здесь"], 1], ["В Москве ___ река, площадь, мечеть.", ["там", "есть", "здесь"], 1], ["В Москве есть ___ мечеть.", ["большой", "большая", "большое"], 1], ["Москва – это ___ город? – Да, это столица!", ["красивый", "красивая", "красивое"], 0], ["Чирчик – большой город? – Нет, это ___ город.", ["маленький", "красивый", "большой"], 0], ["Мои ___ дни: понедельник, среда и пятница.", ["рабочий", "рабочие", "работать"], 1], ["Понедельник, ___, среда…", ["вторник", "четверг", "суббота"], 0], ["…пятница, ___, воскресенье.", ["среда", "суббота", "вторник"], 1], ["Мой выходной ___ – пятница.", ["день", "дни", "каждый"], 0], ["Суббота и воскресенье – мои ___ дни.", ["выходной", "рабочий", "выходные"], 2], ["Я работаю ___ день.", ["выходной", "каждый", "понедельник"], 1], ["Когда ___ твой рабочий день?", ["начинается", "начинает", "начинать"], 0], ["Пятница – мой выходной день. Я не ___.", ["работаешь", "работаю", "работаем"], 1], ["Пятница – выходной день. Мы не ___.", ["работаем", "работаете", "работают"], 0], ["Когда ты отдыхаешь? – ___.", ["Пятница", "В пятницу", "Обычно"], 1], ["Когда в России ___ выходные дни?", ["официальные", "официальный", "официальная"], 0], ["Всю ___ я работаю, а в воскресенье отдыхаю.", ["день", "неделю", "суббота"], 1], ["Что вы ___ делаете в субботу?", ["обычно", "каждый", "всю неделю"], 0], ["Я ___ завтракаю дома. Мне не нравится завтракать в кафе.", ["каждый", "не", "всегда"], 2], ["Я ___ в это кафе каждый день и обедаю там.", ["гуляю", "хожу", "делаю"], 1], ["Вам нравится кино? – Да, я хожу ___ каждый выходной день.", ["в кино", "кино", "там"], 0], ["В выходные я обычно хожу ___.", ["музей", "в музей", "в музее"], 1], ["Мне нравится этот ресторан. Я хожу ___ каждый выходной день!", ["туда", "там", "ресторан"], 0], ["Что ты делаешь в выходные? – Я ___ новости в Интернете.", ["читать", "читаю", "читает"], 1], ["Что ты обычно ___? – Я слушаю радио.", ["слушаешь", "слушаете", "слушает"], 0], ["Что вы обычно ___?", ["фотографируешь", "фотографируете", "фотографируют"], 1], ["Тебе нравится ___ в нарды?", ["играть", "гулять", "читать"], 0], ["Твой брат ___ в теннис?", ["играют", "играете", "играет"], 2], ["Мы обычно ___ в футбол в субботу.", ["играете", "играем", "играть"], 1], ["Олег – мой друг. Он играет в большой ___.", ["теннис", "теннисе", "теннису"], 0], ["Где ты ___ новости? – В газете «Большой город».", ["слушаешь", "читаешь", "гуляешь"], 1], ["Мы всегда ___ храмы и соборы в Петербурге.", ["фотографируем", "делаем", "слушаем"], 0], ["Ты говоришь ___?", ["русский", "по-русски", "русский язык"], 1], ["Мой брат говорит ___.", ["по-английски", "английский язык", "английский"], 0], ["Артур, ты ___ читать по-армянски? – Конечно! Я из Еревана.", ["уметь", "умеешь", "умеет"], 1], ["Твоя жена ___ готовить плов?", ["умеет", "уметь", "умеешь"], 0], ["Твои дети умеют говорить по-русски? – Да, они ___ говорят по-русски.", ["не", "вообще не", "неплохо"], 2], ["Мой друг из Ташкента ___ русский язык в институте.", ["учить", "учит", "учат"], 1], ["Я тоже хочу ___ русский язык!", ["учить", "говорить", "уметь"], 0], ["Мы хотим хорошо ___ по-русски!", ["учить", "говорить", "уметь"], 1], ["Я ___ русский язык каждый день!", ["учу", "говорю", "читаю"], 0], ["Ты ___ Антона?", ["знаю", "знаешь", "знает"], 1], ["Ты знаешь Антона? – Я не знаю ___.", ["его", "него", "он"], 0], ["Это мои друзья. Ты знаешь ___?", ["они", "их", "них"], 1], ["Алло! Алло! Я плохо ___ тебя…", ["слышу", "слушаю", "смотрю"], 0], ["Я не ___ метро. Где оно?", ["смотрю", "слушаю", "вижу"], 2], ["Он говорит по-таджикски. Я не понимаю ___.", ["он", "его", "этот"], 1], ["Мы ___ президента.", ["слушаем", "слушаете", "слушают"], 0], ["Я часто ___ друзей в кафе.", ["знаю", "встречаю", "смотрю"], 1], ["Вы понимаете ___?", ["меня", "вас", "я"], 0]], sections=[[0, "1-қисм. Шаҳарлар ва жойлар"], [9, "2-қисм. Ҳафта кунлари ва иш"], [18, "3-қисм. Дам олиш ва кундалик ҳаёт"], [27, "4-қисм. Машғулотлар ва спорт"], [36, "5-қисм. Тил билиш ва ўрганиш"], [45, "6-қисм. Феъллар ва олмошлар"]];const letters=['A','B','C'];const quiz=document.getElementById('quiz');let answers={};
function render(){quiz.innerHTML='';questions.forEach((q,i)=>{if(sections.some(s=>s[0]===i)){let h=document.createElement('h2');h.className='section';h.textContent=sections.find(s=>s[0]===i)[1];quiz.append(h)}let card=document.createElement('section');card.className='q';let h=document.createElement('h3');h.innerHTML='<span class="num">'+(i+1)+'.</span> '+q[0];card.append(h);let opts=document.createElement('div');opts.className='opts';q[1].forEach((v,j)=>{let lab=document.createElement('label');lab.className='opt';let inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=j;inp.checked=answers[i]===j;inp.addEventListener('change',()=>{answers[i]=j;update()});let span=document.createElement('span');span.textContent=letters[j]+') '+v;lab.append(inp,span);opts.append(lab)});card.append(opts);quiz.append(card)}update()}
function update(){let n=Object.keys(answers).length;document.getElementById('done').textContent=n+' / '+questions.length+' javob';let p=Math.round(n/questions.length*100);document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%'}
document.getElementById('finish').onclick=()=>{let missing=questions.length-Object.keys(answers).length;let score=0;questions.forEach((q,i)=>{if(answers[i]===q[2])score++});let r=document.getElementById('result');r.style.display='block';let pct=Math.round(score/questions.length*100);let msg=pct>=90?'Ajoyib natija!':pct>=70?'Yaxshi natija!':pct>=50?'Yana biroz mashq qiling.':'Xafa bo‘lmang, qayta urinib ko‘ring!';r.innerHTML='<div class="small">TEST NATIJASI</div><div class="score">'+score+' / '+questions.length+'</div><b>'+msg+'</b><p>Siz '+pct+'% savolga to‘g‘ri javob berdingiz.'+(missing?' Javobsiz qoldirilgan: '+missing+'.':' Barcha savollarga javob berdingiz.')+'</p><h3>Javoblar tahlili</h3>'+questions.map((q,i)=>{let ok=answers[i]===q[2];return '<div class="wrong '+(ok?'right':'')+'"><b>'+(i+1)+'. '+(ok?'To‘g‘ri':'Noto‘g‘ri')+'</b><br><span class="small">To‘g‘ri javob: '+letters[q[2]]+') '+q[1][q[2]]+(answers[i]===undefined?' · Javob berilmagan':!ok?' · Siz tanlagan: '+letters[answers[i]]+') '+q[1][answers[i]]:'')+'</span></div>'}).join('')+'<button class="btn primary" onclick="window.scrollTo({top:0,behavior:'smooth'})">Test boshiga qaytish</button>';r.scrollIntoView({behavior:'smooth',block:'start'})};
document.getElementById('reset').onclick=()=>{if(confirm('Barcha javoblarni o‘chirib, testni qayta boshlaysizmi?')){answers={};document.getElementById('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})}};render();
</script></body></html>
